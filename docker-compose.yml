# Production-ready docker-compose.yml
# Usage (production):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# - Keep secrets out of the repo; use  or Docker secrets for DIRECTUS_TOKEN, DB passwords, etc.
# - For quick local dev override use docker-compose.override.yml (checked in) or edit env files.
# - To apply only env/token changes without rebuilding all services:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate --build api
# Notes:
# - The api service reads DIRECTUS_TOKEN; ensure DIRECTUS_TOKEN is set in the env file for production.
# - Do not expose Directus admin ports to the public network in production unless required.

services:
  # FRONTEND: Servido por Nginx (Puerto 80 y 443 para Cloudflare Full SSL)
  web:
    image: ${WEB_IMAGE:-ghcr.io/valanhyr/mana-forge-web:latest}
    build:
      context: ./mana-forge-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_FARO_URL=${VITE_FARO_URL:-}
        - VITE_FARO_APP_NAME=${VITE_FARO_APP_NAME:-mana-forge-web}
        # Public Turnstile site key (safe to expose; the secret stays server-side)
        - VITE_TURNSTILE_SITE_KEY=${CLOUDFLARE_TS_SITE_KEY:-}
    container_name: mana-forge-web-1
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # web served by host nginx in production; no host ports published here
    restart: always
    networks:
      - mana-forge-network

  # Internal backoffice: opt-in and session-protected; live API adapters by default.
  # Explicitly start with: docker compose up -d --build frontdesk
  frontdesk:
    profiles: ["frontdesk"]
    image: ${FRONTDESK_IMAGE:-ghcr.io/valanhyr/mana-forge-frontdesk:latest}
    build:
      context: ./mana-forge-frontdesk
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTDESK_API_URL:-/api}
        VITE_USE_MOCKS: ${FRONTDESK_USE_MOCKS:-false}
    ports:
      - "127.0.0.1:${FRONTDESK_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mana-forge-network

  # BACKEND: Java Spring Boot (Puerto 8080)
  api:
    image: ${API_IMAGE:-ghcr.io/valanhyr/mana-forge-api:latest}
    build:
      context: ./mana-forge-api
      dockerfile: Dockerfile
    container_name: mana-forge-api-1
    ports:
      - "8080:8080"
    environment:
      - SERVICES_PYTHON_ENGINE_URL=http://engine:8000
      - FRONTEND_URL=${FRONTEND_URL}
      - MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_STORE_TYPE=redis
      - directus.url=${DIRECTUS_URL:-http://directus:8080}
      - DIRECTUS_TOKEN=${DIRECTUS_TOKEN:-${DIRECTUS_API_TOKEN}}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - MAIL_ADMIN=${MAIL_ADMIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - OAUTH2_REDIRECT_BASE=${OAUTH2_REDIRECT_BASE}
      - GRAFANA_OTEL_ENABLED=${GRAFANA_OTEL_ENABLED:-false}
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_AUTH=${GRAFANA_OTLP_AUTH:-}
      # Concurrency guard: fail fast with 429 instead of opening unbounded
      # simultaneous provider calls (which would trip Groq/Gemini rate limits).
      - AI_MAX_CONCURRENT_REQUESTS=${AI_MAX_CONCURRENT_REQUESTS:-4}
      # Cloudflare Turnstile — verifies the token sent by the homepage widget.
      # Enabling is automatic once CLOUDFLARE_TS_SECRET_KEY is present.
      - CLOUDFLARE_TS_SITE_KEY=${CLOUDFLARE_TS_SITE_KEY:-}
      - CLOUDFLARE_TS_SECRET_KEY=${CLOUDFLARE_TS_SECRET_KEY:-}
      # AI abuse controls for the public analysis endpoint
      - AI_QUOTA_ENABLED=${AI_QUOTA_ENABLED:-true}
      - AI_QUOTA_ANONYMOUS_DAILY=${AI_QUOTA_ANONYMOUS_DAILY:-5}
      - AI_QUOTA_AUTHENTICATED_DAILY=${AI_QUOTA_AUTHENTICATED_DAILY:-25}
      - AI_CACHE_TTL_HOURS=${AI_CACHE_TTL_HOURS:-24}
      # Backoffice is closed unless authenticated user IDs are explicitly allowlisted.
      - FRONTDESK_OPERATOR_IDS=${FRONTDESK_OPERATOR_IDS:-}
      - FRONTDESK_URL=${FRONTDESK_URL:-}
      - FRONTDESK_CONTACT_TICKETS_ENABLED=${FRONTDESK_CONTACT_TICKETS_ENABLED:-true}
      - FRONTDESK_EMAIL_TEMPLATE_COLLECTION=${FRONTDESK_EMAIL_TEMPLATE_COLLECTION:-email_templates}
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - mana-forge-network

  # ENGINE: Python FastAPI (Puerto 8000)
  # CRÍTICO: sin `ports`, el engine es inalcanzable desde internet y solo
  # escucha en la red interna de Docker. Publicar 8000 exponía la IA
  # directamente, saltándose Cloudflare, nginx y el rate limit del backend.
  # El proxy sigue siendo el único camino: web/nginx -> api -> engine.
  engine:
    image: ${ENGINE_IMAGE:-ghcr.io/valanhyr/mana-forge-engine:latest}
    build:
      context: ./mana-forge-engine
      dockerfile: Dockerfile
    container_name: mana-forge-engine-1
    expose:
      - "8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-groq/compound-mini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=mana-forge-engine
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_AUTH=${GRAFANA_OTLP_AUTH:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - mana-forge-network

  # CACHE: Redis
  redis:
    image: redis:7-alpine
    container_name: mana-forge-cache-1
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # redis internal only (no host port)
    restart: always
    networks:
      - mana-forge-network

  # DIRECTUS DATABASE: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: directus_db
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # postgres internal only (no host port)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mana-forge-network
    restart: always

  # DIRECTUS CMS
  directus:
    image: directus/directus:latest
    container_name: directus_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus_secure_password_change_me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin_password_change_me
      REFRESH_TOKEN_TTL: 7d
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:9055"
      LOG_LEVEL: info
      PORT: "8080"
      # Directus public URL and persistent secret
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      SECRET: ${DIRECTUS_SECRET:-changeme_generate_strong_secret}

    volumes:
      - directus_uploads:/directus/uploads
      - ./snapshots:/directus/snapshots
      - ./extensions:/directus/extensions
    ports:
      - "9055:8080"
    networks:
      - mana-forge-network
    restart: unless-stopped

  # DIRECTUS BACKUP
  backup:
    image: postgres:15-alpine
    container_name: directus_backup
    depends_on:
      - postgres
    environment:
      PGPASSWORD: directus_secure_password_change_me
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
      while true; do
        echo '[Backup] Iniciando backup a las '$(date +%Y-%m-%d\ %H:%M:%S);
        pg_dump -h postgres -U directus -d directus > /backups/directus_$(date +\%Y\%m\%d_\%H\%M\%S).sql;
        echo '[Backup] Completado a las '$(date +%Y-%m-%d\ %H:%M:%S);
        find /backups -name 'directus_*.sql' -mtime +7 -delete;
        sleep 86400;
      done
      "
    networks:
      - mana-forge-network
    restart: unless-stopped

  # DATABASE MANAGEMENT: Adminer
  adminer:
    image: adminer
    container_name: local_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - mana-forge-network

  nginx:
    image: nginx:stable
    container_name: mana-forge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

networks:
  mana-forge-network:
    driver: bridge

volumes:
  postgres_data:
  directus_uploads:
