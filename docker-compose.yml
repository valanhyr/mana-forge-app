services:
  # FRONTEND: Servido por Nginx (Puerto 80 y 443 para Cloudflare Full SSL)
  web:
    image: ${WEB_IMAGE:-ghcr.io/valanhyr/mana-forge-web:latest}
    build:
      context: ./mana-forge-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_FARO_URL=${VITE_FARO_URL:-}
        - VITE_FARO_APP_NAME=${VITE_FARO_APP_NAME:-mana-forge-web}
    container_name: mana-forge-web-1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # web served by host nginx in production; no host ports published here
    restart: always
    networks:
      - mana-forge-network

  # BACKEND: Java Spring Boot (Puerto 8080)
  api:
    image: ${API_IMAGE:-ghcr.io/valanhyr/mana-forge-api:latest}
    build:
      context: ./mana-forge-api
      dockerfile: Dockerfile
    container_name: mana-forge-api-1
    ports:
      - "8080:8080"
    environment:
      - SERVICES_PYTHON_ENGINE_URL=http://engine:8000
      - FRONTEND_URL=${FRONTEND_URL}
      - MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_STORE_TYPE=redis
      - directus.url=${DIRECTUS_URL:-http://directus_app:8080}
      - directus.token=${DIRECTUS_API_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - MAIL_ADMIN=${MAIL_ADMIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - OAUTH2_REDIRECT_BASE=${OAUTH2_REDIRECT_BASE}
      - GRAFANA_OTEL_ENABLED=${GRAFANA_OTEL_ENABLED:-false}
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_AUTH=${GRAFANA_OTLP_AUTH:-}
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - mana-forge-network

  # ENGINE: Python FastAPI (Puerto 8000)
  engine:
    image: ${ENGINE_IMAGE:-ghcr.io/valanhyr/mana-forge-engine:latest}
    build:
      context: ./mana-forge-engine
      dockerfile: Dockerfile
    container_name: mana-forge-engine-1
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-groq/compound-mini}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=mana-forge-engine
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_AUTH=${GRAFANA_OTLP_AUTH:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - mana-forge-network

  # CACHE: Redis
  redis:
    image: redis:7-alpine
    container_name: mana-forge-cache-1
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # redis internal only (no host port)
    restart: always
    networks:
      - mana-forge-network

  # DIRECTUS DATABASE: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: directus_db
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # postgres internal only (no host port)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mana-forge-network
    restart: always

  # DIRECTUS CMS
  directus:
    image: directus/directus:latest
    container_name: directus_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus_secure_password_change_me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin_password_change_me
      REFRESH_TOKEN_TTL: 7d
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:9055"
      LOG_LEVEL: info
      PORT: "8080"
    volumes:
      - directus_uploads:/directus/uploads
      - ./snapshots:/directus/snapshots
      - ./extensions:/directus/extensions
    ports:
      - "9055:8080"
    networks:
      - mana-forge-network
    restart: unless-stopped

  # DIRECTUS BACKUP
  backup:
    image: postgres:15-alpine
    container_name: directus_backup
    depends_on:
      - postgres
    environment:
      PGPASSWORD: directus_secure_password_change_me
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
      while true; do
        echo '[Backup] Iniciando backup a las '$(date +%Y-%m-%d\ %H:%M:%S);
        pg_dump -h postgres -U directus -d directus > /backups/directus_$(date +\%Y\%m\%d_\%H\%M\%S).sql;
        echo '[Backup] Completado a las '$(date +%Y-%m-%d\ %H:%M:%S);
        find /backups -name 'directus_*.sql' -mtime +7 -delete;
        sleep 86400;
      done
      "
    networks:
      - mana-forge-network
    restart: unless-stopped

  # DATABASE MANAGEMENT: Adminer
  adminer:
    image: adminer
    container_name: local_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - mana-forge-network

networks:
  mana-forge-network:
    driver: bridge

volumes:
  postgres_data:
  directus_uploads: