services:
  # FRONTEND: Servido por Nginx (Puerto 80 y 443 para Cloudflare Full SSL)
  web:
    image: ${WEB_IMAGE:-ghcr.io/valanhyr/mana-forge-web:latest}
    build:
      context: ./mana-forge-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_FARO_URL=${VITE_FARO_URL:-}
        - VITE_FARO_APP_NAME=${VITE_FARO_APP_NAME:-mana-forge-web}
    container_name: mana-forge-web-1
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - mana-forge-network

  # BACKEND: Java Spring Boot (Puerto 8080)
  api:
    image: ${API_IMAGE:-ghcr.io/valanhyr/mana-forge-api:latest}
    build:
      context: ./mana-forge-api
      dockerfile: Dockerfile
    container_name: mana-forge-api-1
    ports:
      - "8080:8080"
    environment:
      # Comunicación interna: 'engine' es el nombre del servicio de abajo
      - SERVICES_PYTHON_ENGINE_URL=http://engine:8000
      - FRONTEND_URL=${FRONTEND_URL}
      - STRAPI_API_URL=${STRAPI_API_URL}
      - STRAPI_API_TOKEN=${STRAPI_API_TOKEN}
      - MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_STORE_TYPE=redis
      # SMTP: Resend
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - MAIL_ADMIN=${MAIL_ADMIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - GRAFANA_OTEL_ENABLED=${GRAFANA_OTEL_ENABLED:-false}
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_AUTH=${GRAFANA_OTLP_AUTH:-}
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_started
    restart: always
    networks:
      - mana-forge-network

  # ENGINE: Python FastAPI (Puerto 8000)
  # Port 8000 is NOT published to the host — reachable only inside mana-forge-network.
  # The Spring API calls it as http://engine:8000 via the internal network.
  engine:
    image: ${ENGINE_IMAGE:-ghcr.io/valanhyr/mana-forge-engine:latest}
    build:
      context: ./mana-forge-engine
      dockerfile: Dockerfile
    container_name: mana-forge-engine-1
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_SERVICE_NAME=mana-forge-engine
      - OTEL_EXPORTER_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${GRAFANA_OTLP_AUTH:-}
    restart: always
    networks:
      - mana-forge-network

  # CACHE: Redis para cachear respuestas de Strapi/Scryfall/DB
  redis:
    image: redis:7-alpine
    container_name: mana-forge-cache-1
    # Secure with password from .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    restart: always
    networks:
      - mana-forge-network

# Red interna para que los contenedores se vean por nombre (api, engine)
networks:
  mana-forge-network:
    driver: bridge
