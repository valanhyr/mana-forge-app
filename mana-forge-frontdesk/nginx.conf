# The trusted host ingress must overwrite X-Forwarded-Proto when terminating TLS.
# Accept only the two protocol names, never arbitrary forwarded header values.
map $http_x_forwarded_proto $frontdesk_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the /api prefix. Cookies and X-CSRF-TOKEN pass through unchanged.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $frontdesk_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not trust browser-supplied IP headers or append to an attacker-controlled XFF.
        # Backoffice identity/quota uses the authenticated account; IP limits see this proxy's peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_redirect off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Vite names production assets by content hash. Missing assets must be 404, not SPA HTML.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
