# Mana Forge nginx site (preserve auth and cookies)

upstream backend_api { server 127.0.0.1:8080; }
upstream backend_engine { server 127.0.0.1:8000; }
upstream backend_web { server 127.0.0.1:5173; }
upstream backend_directus { server 127.0.0.1:9055; }
upstream backend_adminer { server 127.0.0.1:8088; }

server {
    listen 80;
    listen [::]:80;
    server_name mana-forge.com;

    # redirect only valid host to https, avoid IP redirect loops
    if ($host = 'mana-forge.com') {
        return 301 https://$host$request_uri;
    }
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mana-forge.com;

    ssl_certificate /etc/ssl/cf/fullchain.pem;
    ssl_certificate_key /etc/ssl/cf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://backend_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 90s;
    }

    location /directus/ {
        proxy_pass http://backend_directus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /adminer/ {
        proxy_pass http://backend_adminer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /health/api { proxy_pass http://backend_api/actuator/health; proxy_set_header Host $host; }
    location = /health/engine { proxy_pass http://backend_engine/health; proxy_set_header Host $host; }
    location = /health/web { proxy_pass http://backend_web/; proxy_set_header Host $host; }
}
