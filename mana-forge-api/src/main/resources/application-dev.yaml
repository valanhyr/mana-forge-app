# Perfil de desarrollo local — sesiones en memoria, sin Redis requerido
# Usar con: -Dspring.profiles.active=dev  (VM options en IntelliJ/Run Config)
#   o bien: export SPRING_PROFILES_ACTIVE=dev  antes de ./mvnw spring-boot:run
spring:
  session:
    store-type: none

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.session.RedisSessionConfiguration

logging:
  level:
    com.manaforge.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.cache: TRACE
    com.couchbase: DEBUG
